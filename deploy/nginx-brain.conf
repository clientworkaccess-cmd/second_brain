# nginx in front of Second Brain (the brain-app service), for a host that uses
# nginx rather than Traefik.
#
#   sudo cp /opt/brain-app/deploy/nginx-brain.conf /etc/nginx/sites-available/brain
#   sudo ln -s /etc/nginx/sites-available/brain /etc/nginx/sites-enabled/brain
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d brain.example.com
#
# certbot rewrites this file to add the certificate and the redirect from
# port 80. The app needs HTTPS: the captcha runs on the browser's crypto,
# which browsers only switch on for a secure page.
#
# Once this is in place, bind the app to loopback (HOSTNAME=127.0.0.1 in the
# service unit, which is the default there) so the proxy is the only way in.

server {
    listen 80;
    listen [::]:80;
    server_name brain.example.com;

    # Long enough for an ingest or a chat answer; the app streams both.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # The chat and the ingest are event streams: hand bytes on as they come.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
    }
}
