# n8n runs in Docker on its own network (n8n_default, gateway 172.16.0.1) and
# cannot reach the app on the host's 127.0.0.1. This listens on that gateway
# address only, which nothing outside the server can reach, and passes on the
# two paths n8n needs. It adds no X-Real-IP or X-Forwarded-For, so the app
# sees a call from the server itself (lib/ingest.ts). In n8n: appUrl
# http://172.16.0.1:3004. Check the gateway with:
#   docker inspect n8n-n8n-1 --format '{{range .NetworkSettings.Networks}}{{.Gateway}}{{end}}'
server {
    listen 172.16.0.1:3004;
    server_name _;
    client_max_body_size 5m;
    proxy_read_timeout 60s;

    location = /api/ingest {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header Connection "";
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }
}
