# Traefik dynamic configuration for Second Brain (the brain-app service).
#
# Drop this in your file-provider directory (commonly /etc/traefik/dynamic/) and
# Traefik picks it up without a restart. File provider rather than Docker labels
# because the app runs as a systemd service on the host, not a container.
#
# Assumes your static config already has:
#   - a `websecure` entryPoint on :443
#   - a `letsencrypt` certResolver
# Rename below to match what you actually call them.
#
# Every name here starts with `brain-app`, so this file can sit next to the
# older dashboard's without either one replacing the other's routers.

http:
  routers:
    brain-app:
      rule: "Host(`brain.example.com`)" # the real domain is still to be decided
      entryPoints:
        - websecure
      service: brain-app
      middlewares:
        - brain-app-headers
      tls:
        certResolver: letsencrypt

  services:
    brain-app:
      loadBalancer:
        servers:
          # Next binds loopback only. Traefik is the sole route in from outside.
          - url: "http://127.0.0.1:3003"

        responseForwarding:
          # Traefik already flushes recognised streaming responses immediately
          # and ignores this value for them, so SSE works without any of this.
          # Set explicitly anyway: it costs nothing and it documents that the
          # chat and ingest routes depend on not being buffered.
          flushInterval: -1ms

  middlewares:
    # No password here. Sign-in is the app's own (AUTH_EMAIL and
    # AUTH_PASSWORD_HASH in the env file). A second prompt in front of it would
    # only mean two passwords to share.
    brain-app-headers:
      headers:
        stsSeconds: 31536000
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "same-origin"
# ---------------------------------------------------------------------------
# The app trusts X-Forwarded-For and X-Forwarded-Proto
# ---------------------------------------------------------------------------
#
# The sign-in throttle counts wrong guesses per client address, and the session
# cookie is marked Secure when the request arrived over HTTPS. Both are read
# from the headers Traefik sets. That is safe because the app listens on
# loopback only, so nothing but Traefik can set them. If the port is ever
# opened to the network, those headers become something a caller can invent.
#
# ---------------------------------------------------------------------------
# Two middlewares to NOT put on this router
# ---------------------------------------------------------------------------
#
# `buffering` — it reads the whole response before forwarding, which turns the
#   ingest progress stream and the chat answer into one clump at the very end.
#   That looks exactly like "the agent doesn't stream" and will send you
#   debugging Claude instead of the proxy. Traefik applies no buffering unless
#   you ask for it, so the fix is simply not to add it here.
#
# `compress` — if you attach it globally, exclude the stream:
#     compress:
#       excludedContentTypes:
#         - text/event-stream
#   Compressing an event stream buys nothing and can hold bytes back waiting to
#   fill a block.
#
# Upload size: Traefik does not cap request bodies by default, so 50MB
# documents pass through untouched. The only way to introduce a limit is the
# `buffering` middleware's maxRequestBodyBytes — which is the same middleware
# that breaks SSE. If you ever need a cap, put it on a separate router scoped
# to /api/upload only, never on /api/chat or /api/jobs.
