name: Deploy

# Manual only, until the first deploy has been done by hand on the VPS and has
# worked. A pipeline whose commands have never succeeded manually is impossible
# to debug. Once it has, add:
#
#   push:
#     branches: [main]
on:
  workflow_dispatch:

# Two runs in quick succession must not build on the box at the same time —
# the second would restart the service mid-build of the first.
concurrency:
  group: deploy-brain-app
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        # The build happens on the VPS, not here. It keeps the pipeline to one
        # step and means CI never needs the production env file.
        #
        # A key, not a password, and the host's key is pinned. Four secrets:
        #
        #   SSH_HOST         the server
        #   SSH_USER         a user allowed to run the deploy script with sudo
        #   SSH_KEY          private half of a key made for this and nothing else
        #   SSH_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <host>`, compared
        #                    with the fingerprint shown on the server itself
        #
        # On the server, limit what the key may do. In authorized_keys:
        #
        #   command="sudo /opt/brain-app/deploy/deploy.sh",no-port-forwarding,no-agent-forwarding,no-X11-forwarding,no-pty ssh-ed25519 AAAA...
        #
        # and in sudoers, for that user, that one script without a password.
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is not set."
              exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$SSH_USER@$SSH_HOST" \
              'sudo /opt/brain-app/deploy/deploy.sh'
